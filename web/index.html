<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Семейные расходы</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="layout">
    <header class="header">
      <div>
        <p class="eyebrow">Домашний бюджет</p>
        <h1>Семейные расходы</h1>
        <p class="subtitle">Общий список трат семьи в одном месте</p>
      </div>
      <button id="new-expense" class="primary">Добавить трату</button>
    </header>

    <section class="summary">
      <article><span>Всего расходов</span><strong id="total">0 ₽</strong></article>
      <article><span>Количество записей</span><strong id="count">0</strong></article>
      <article><span>Пользователей</span><strong id="users">0</strong></article>
    </section>

    <section class="panel filters">
      <label>Пользователь<input id="filter-user" type="number" min="1" placeholder="Telegram ID"></label>
      <label>Категория<select id="filter-category"></select></label>
      <label>С<input id="filter-from" type="date"></label>
      <label>По<input id="filter-to" type="date"></label>
      <button id="apply-filters" class="secondary">Применить</button>
      <button id="reset-filters" class="plain">Сбросить</button>
    </section>

    <section class="panel table-panel">
      <div class="table-title"><h2>История расходов</h2><span id="status"></span></div>
      <div class="table-scroll">
        <table>
          <thead><tr><th>Дата</th><th>Пользователь</th><th>Категория</th><th>Комментарий</th><th>Сумма</th><th></th></tr></thead>
          <tbody id="expense-list"></tbody>
        </table>
      </div>
      <div id="empty" class="empty" hidden>По выбранным условиям расходов нет</div>
    </section>
  </main>

  <dialog id="expense-dialog">
    <form id="expense-form">
      <div class="dialog-title"><h2 id="form-title">Новая трата</h2><button type="button" id="close-dialog" class="close">×</button></div>
      <input id="expense-id" type="hidden">
      <label>Telegram ID<input id="user-id" type="number" min="1" required></label>
      <label>Сумма<input id="amount" type="number" min="0.01" step="0.01" required></label>
      <label>Категория<select id="category" required></select></label>
      <label>Дата<input id="spent-at" type="date" required></label>
      <label>Комментарий<input id="comment" type="text" maxlength="500" required></label>
      <p id="form-error" class="form-error"></p>
      <div class="dialog-actions"><button type="button" id="cancel-dialog" class="plain">Отмена</button><button class="primary" type="submit">Сохранить</button></div>
    </form>
  </dialog>

  <script src="/app.js"></script>
</body>
</html>
